name: Build Portex Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/portex-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/portex.apk
          cp release-apks/portex.apk release-apks/portex-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portex-apk
          path: release-apks/
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: "PORTEX Mobile App v1.0.1"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 📱 PORTEX Official Android App (v1.0.1)
            
            Hyperlocal Classifieds & On-Demand Logistics Platform — Direct Android Application.
            
            ### 🛠️ What's New in v1.0.1:
            - **100% Mobile Friendly**: Fixed horizontal scrolling issue where pages scrolled off the right edge.
            - **Strict Viewport Containment**: Locked viewport scale and bounds for ultra-responsive mobile navigation.
            - **Native WebView Polish**: Enhanced touch responsiveness and overscroll elimination.
            
            ### 📥 Download APK
            - **[Download portex.apk (Recommended)](https://github.com/Satyacoder-31/portex/releases/download/v1.0.1/portex.apk)**
            - **[Download portex-release.apk](https://github.com/Satyacoder-31/portex/releases/download/v1.0.1/portex-release.apk)**
            - **[Download portex-debug.apk](https://github.com/Satyacoder-31/portex/releases/download/v1.0.1/portex-debug.apk)**
            
            ### ✨ Features Included:
            - **Hyperlocal Marketplace**: Buy and sell verified items with instant Porter shipping trigger.
            - **On-Demand Logistics Fleet**: 2-Wheeler, 3-Wheeler, Tata Ace, and Canter trucks.
            - **Live GPS Tracking**: Real-time driver telemetry and interactive vector map.
            - **Camera & Photo Picker**: Seamless listing photo capture with Android native file chooser.
            - **GST Invoices**: One-click download of compliant tax invoices to device storage.
            - **Offline Recovery**: Intelligent offline screen with pull-to-refresh connectivity retry.
          files: |
            release-apks/portex.apk
            release-apks/portex-release.apk
            release-apks/portex-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
